---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: worldmonitor
    # Topology icon. The console matches this against a PREDEFINED icon set
    # (runtime first, then app.kubernetes.io/name) — arbitrary image URLs are
    # not supported, and an unrecognized value renders no icon at all.
    app.openshift.io/runtime: nodejs
  annotations:
    # Makes the topology node link to the source repo.
    app.openshift.io/vcs-uri: https://github.com/ryannix123/worldmonitor-redhat
    # Same pattern as the openemr-on-openshift deployment. Note that Red Hat's
    # Topology docs only document the predefined icon set matched via the
    # runtime label — custom-icon is not in them, so treat it as best-effort:
    # if the console honors it you get the logo, otherwise the nodejs runtime
    # icon above is the fallback and nothing breaks either way.
    app.openshift.io/custom-icon: "https://cdn-1.webcatalog.io/catalog/world-monitor/world-monitor-icon-filled-256.png?v=1771821726882"
    # OpenShift's image-trigger controller resolves this ImageStreamTag to the
    # fully-qualified internal registry path and writes it into the container's
    # image field — in whatever namespace this lands in. It also redeploys
    # automatically when a new image is pushed to the tag.
    #
    # This replaces relying on ImageStream lookupPolicy.local, which is NOT
    # honored for Deployments the way it is for DeploymentConfigs: the kubelet
    # sees the bare string "worldmonitor:latest", treats it as a Docker Hub
    # reference, and fails with ImagePullBackOff on docker.io/library/.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"worldmonitor:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"worldmonitor\")].image",
        "pause":"false"}]
    app.openshift.io/connects-to: >-
      [{"apiVersion":"apps/v1","kind":"Deployment","name":"redis-rest"},
       {"apiVersion":"apps/v1","kind":"Deployment","name":"ais-relay"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worldmonitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worldmonitor
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: worldmonitor
    spec:
      containers:
        - name: worldmonitor
          # Overwritten by the image.openshift.io/triggers annotation above.
          image: image-registry.openshift-image-registry.svc:5000/openshift/worldmonitor:latest
          # Already the default for a `latest` tag; explicit so all four
          # workloads read the same and a future tag rename can't regress it.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Non-secret tunables and any provider keys you choose to keep in a
            # ConfigMap. Secret always wins on key collision (listed last).
            - configMapRef:
                name: worldmonitor-config
            - secretRef:
                name: worldmonitor-apikeys
                optional: true
          env:
            - name: UPSTASH_REDIS_REST_URL
              value: "http://redis-rest"
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-redis
                  key: REDIS_TOKEN
            # Upstream compose sets this on the relay but NOT on the app, which
            # looks like an oversight — in-cluster traffic is plain HTTP here too.
            - name: UPSTASH_ALLOW_INSECURE_HTTP
              value: "true"
            - name: WS_RELAY_URL
              value: "http://ais-relay:3004"
            # Counterpart to the relay's WORLDMONITOR_RELAY_KEY — the app API
            # validates the relay's CII warm-ping against this value. Same secret
            # key on both sides so they always match.
            # The app validates the relay's X-WorldMonitor-Key header against
            # this allowlist. Same secret value on both sides, so the relay's
            # warm-pings authenticate. Without it: 401 "API key required".
            - name: WORLDMONITOR_VALID_KEYS
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-relay
                  key: WORLDMONITOR_RELAY_KEY
            # Current upstream (server/gateway.ts isRelayWarmPingRequest) checks
            # the relay's X-WorldMonitor-Key against the app's OWN
            # WORLDMONITOR_RELAY_KEY — a dedicated relay<->gateway secret that
            # unlocks only the warm-ping allowlist (chokepoints, service
            # statuses, feed digest). Since #3541 there is no Origin-trust
            # fallback, so without this the relay's warm-pings 401.
            # Same secret key as the relay, so both sides agree by construction.
            # (The VALID_KEYS mapping above is the older contract and is kept so
            # nothing that works today breaks; upstream's guidance is that the
            # relay key should NOT be an enterprise key — a later cleanup is to
            # give WORLDMONITOR_VALID_KEYS its own value in secrets/relay.env.)
            - name: WORLDMONITOR_RELAY_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-relay
                  key: WORLDMONITOR_RELAY_KEY
            # Signs the wm-session cookie. The browser has no API key, so
            # key-gated endpoints (get-risk-scores / CII, cable-health) reject
            # it with 401 "API key required" unless the app can mint a session.
            # Unset = those panels render UNAVAILABLE even though the API
            # computes the data correctly.
            - name: WM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-relay
                  key: WM_SESSION_SECRET
            - name: LOCAL_API_PORT
              value: "46123"
            - name: LOCAL_API_MODE
              value: "docker"
            - name: LOCAL_API_CLOUD_FALLBACK
              value: "false"
          # /api/sidecar-health proves BOTH nginx and the node sidecar are up,
          # per the upstream healthcheck comment.
          startupProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
    app.kubernetes.io/part-of: worldmonitor
spec:
  selector:
    app.kubernetes.io/name: worldmonitor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
    app.kubernetes.io/part-of: worldmonitor
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  to:
    kind: Service
    name: worldmonitor
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
