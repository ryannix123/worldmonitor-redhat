name: build

on:
  schedule:
    # 07:00 UTC = 02:00 CDT. Late enough that upstream's day of commits has
    # settled, early enough that a failure is waiting when you start work.
    - cron: '0 7 * * *'
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/build.yml'
      - 'upstream.env'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to build (overrides upstream.env)'
        required: false

env:
  REGISTRY: quay.io
  IMAGE_NS: ryan_nix
  IMAGE_NAME: worldmonitor-openshift
  UPSTREAM_REPO: koala73/worldmonitor

jobs:
  # Resolve the upstream commit ONCE so every matrix leg builds the identical
  # tree. Without this, a commit landing mid-run would produce an amd64 image
  # and an arm64 image from different source — a manifest list that lies.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      short: ${{ steps.pin.outputs.short }}
      date: ${{ steps.pin.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - id: pin
        run: |
          set -euo pipefail
          # Precedence: explicit dispatch input > UPSTREAM_SHA > UPSTREAM_REF > main.
          #
          # Policy (2026-09-24): the nightly FLOATS on upstream main. Upstream
          # ships daily and cuts no release tags, so main is the only meaningful
          # target. The trade-off is that an upstream layout change can break the
          # build (e.g. a renamed npm script, a new top-level directory) — that
          # is acceptable because `manifest` only advances `latest` after every
          # image builds AND passes its smoke test, so a red run leaves the
          # previous good images in place. Set UPSTREAM_SHA in upstream.env to
          # freeze on a known-good commit (e.g. before a demo or recording).
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          elif [ -f upstream.env ]; then
            # shellcheck disable=SC1091
            . ./upstream.env
            REF="${UPSTREAM_SHA:-${UPSTREAM_REF:-main}}"
          else
            REF=main
          fi
          echo "Resolving ${REF} in ${UPSTREAM_REPO}"
          SHA="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "${REF}" | cut -f1)"
          # A full SHA passed as REF has no ls-remote entry — use it directly.
          if [ -z "$SHA" ]; then
            case "$REF" in
              [0-9a-f]*) SHA="$REF" ;;
              *) echo "::error::Cannot resolve ref '${REF}'"; exit 1 ;;
            esac
          fi
          {
            echo "sha=${SHA}"
            echo "short=${SHA:0:7}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned to ${SHA}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Upstream source at the pinned SHA, plus this repo's containers/ dir.
      - name: Fetch upstream at resolved SHA
        run: |
          set -euo pipefail
          # This repo's files are at $GITHUB_WORKSPACE from actions/checkout.
          # Anchor to it explicitly so a `cd` never changes what the copy sees.
          REPO="$GITHUB_WORKSPACE"

          # Fail loudly and early if the build inputs are not where they must
          # be — a missing Containerfile should say so, not surface later as a
          # confusing `cp: cannot stat`.
          for f in containers/Containerfile.ubi10 containers/entrypoint.sh; do
            [ -f "$REPO/$f" ] || { echo "::error::missing $f in repo checkout"; ls -la "$REPO"; exit 1; }
          done

          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPO}.git" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach "${{ needs.resolve.outputs.sha }}"

          # The Containerfile runs `npm run inventory:facts` to produce
          # api/_inventory-facts.generated.js (upstream does it in postinstall,
          # which --ignore-scripts skips). Fail here, with a readable message,
          # if upstream renames or removes that script — not deep in the build.
          node -e "const s=require('$RUNNER_TEMP/upstream/package.json').scripts||{}; if(!s['inventory:facts']){console.error('::error::upstream package.json has no inventory:facts script at this SHA');process.exit(1)}"

          mkdir -p "$RUNNER_TEMP/upstream/containers"
          cp "$REPO/containers/Containerfile.ubi10" \
             "$REPO/containers/entrypoint.sh" \
             "$RUNNER_TEMP/upstream/containers/"
          # Also carry the SBOM summary helper so later steps at repo root can
          # find it — those run from $REPO, so nothing to copy, but assert it.
          [ -f "$REPO/ci/scan-summary.py" ] || echo "::warning::ci/scan-summary.py absent; scan summary will skip"

      - name: Build
        id: build
        run: |
          cd "$RUNNER_TEMP/upstream"
          set -euo pipefail
          podman build --runtime runc \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg VERSION="${{ needs.resolve.outputs.short }}" \
            --build-arg VCS_REF="${{ needs.resolve.outputs.sha }}" \
            --build-arg BUILD_DATE="${{ needs.resolve.outputs.date }}" \
            -f containers/Containerfile.ubi10 \
            -t "localhost/${IMAGE_NAME}:${{ matrix.arch }}" \
            .

      # Fail before pushing if the container cannot actually serve. A green
      # build that produces an image which 502s is worse than a red build.
      - name: Smoke test
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          podman run -d --name smoke -p 18080:8080 \
            -e LOCAL_API_MODE=docker \
            "localhost/${IMAGE_NAME}:amd64"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/sidecar-health >/dev/null 2>&1; then
              echo "sidecar-health OK after ${i}s"; break
            fi
            [ "$i" = 40 ] && { echo "::error::health check never passed"; podman logs smoke; exit 1; }
            sleep 1
          done
          # The SPA entry is dashboard.html, not index.html (Vite renames it via
          # dashboardHtmlOutputPlugin). Assert the fallback actually serves.
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<!doctype html' \
            || { echo "::error::SPA fallback did not serve HTML"; exit 1; }
          # Non-root check: OpenShift will run this as an arbitrary UID, so the
          # image must never bake in a root default.
          UID_IN_IMAGE="$(podman inspect localhost/${IMAGE_NAME}:amd64 --format '{{.Config.User}}')"
          [ "$UID_IN_IMAGE" = "1001" ] || { echo "::error::expected USER 1001, got '${UID_IN_IMAGE}'"; exit 1; }
          podman rm -f smoke

      # Export once to an OCI archive rather than pointing Syft and Grype at
      # podman's local store. `podman:` transport requires the tools to talk to
      # podman's socket/graph driver, which is fragile on hosted runners; a
      # tarball is unambiguous and both tools read it natively.
      - name: Export image for scanning
        run: |
          set -euo pipefail
          podman save --format oci-archive \
            -o "image-${{ matrix.arch }}.tar" \
            "localhost/${IMAGE_NAME}:${{ matrix.arch }}"

      - name: Generate SBOM
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft "oci-archive:image-${{ matrix.arch }}.tar" \
            -o "spdx-json=sbom-${{ matrix.arch }}.spdx.json" \
            -o table

      - name: Scan
        id: scan
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
          # Report only — no failure threshold. The UBI base carries CVEs that
          # Red Hat has triaged as not-affected or has not shipped fixes for,
          # so a severity gate here fails on things this repo cannot remediate.
          # Findings land in the run summary and in the uploaded artifact.
          grype "oci-archive:image-${{ matrix.arch }}.tar" \
            -o table \
            -o "json=scan-${{ matrix.arch }}.json"

      # Surface counts in the run summary so a Critical is visible without
      # downloading an artifact.
      - name: Scan summary
        if: always()
        run: |
          set -euo pipefail
          [ -f "scan-${{ matrix.arch }}.json" ] || exit 0
          python3 ci/scan-summary.py \
            "scan-${{ matrix.arch }}.json" "${{ matrix.arch }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.arch }}
          path: |
            sbom-${{ matrix.arch }}.spdx.json
            scan-${{ matrix.arch }}.json
          retention-days: 90

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$QUAY_PASS" | podman login -u "$QUAY_USER" --password-stdin "${REGISTRY}"
          DEST="${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}"
          podman push "localhost/${IMAGE_NAME}:${{ matrix.arch }}" \
            "${DEST}:${{ needs.resolve.outputs.short }}-${{ matrix.arch }}"

  # Multi-arch manifest so `podman pull` resolves correctly on your M5 (arm64)
  # and on x86 OpenShift nodes without anyone passing --platform.
  # The relay is a second image with its own repo. Separate job rather than a
  # matrix dimension on `build` because its smoke test and Containerfile differ
  # and folding them together would make both harder to read.
  build-relay:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RELAY_IMAGE: worldmonitor-ais-relay        # local build tag
      IMAGE_NAME: worldmonitor-openshift          # shared Quay repo (push dest)
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream at resolved SHA
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE"
          [ -f "$REPO/containers/Containerfile.ubi10-relay" ] \
            || { echo "::error::missing containers/Containerfile.ubi10-relay"; exit 1; }
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPO}.git" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach "${{ needs.resolve.outputs.sha }}"
          # scripts/ais-relay.cjs requires modules from a top-level shared/
          # directory (added upstream, seen at 158fd6f) that the Containerfile
          # COPYs beside scripts/. Assert it exists so a future upstream move
          # fails here with a clear message, not as MODULE_NOT_FOUND in smoke.
          [ -d "$RUNNER_TEMP/upstream/shared" ] \
            || { echo "::error::upstream shared/ directory not found at this SHA"; exit 1; }
          mkdir -p "$RUNNER_TEMP/upstream/containers"
          cp "$REPO/containers/Containerfile.ubi10-relay" \
             "$RUNNER_TEMP/upstream/containers/"

      - name: Build
        run: |
          cd "$RUNNER_TEMP/upstream"
          set -euo pipefail
          podman build --runtime runc \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg VERSION="${{ needs.resolve.outputs.short }}" \
            --build-arg VCS_REF="${{ needs.resolve.outputs.sha }}" \
            --build-arg BUILD_DATE="${{ needs.resolve.outputs.date }}" \
            -f containers/Containerfile.ubi10-relay \
            -t "localhost/${RELAY_IMAGE}:${{ matrix.arch }}" \
            .

      # The relay needs a RELAY_SHARED_SECRET to boot (it refuses without one)
      # and will try to open upstream websockets. We only assert it starts,
      # binds 3004, and stays up a few seconds — not that it connects to live
      # data sources, which need real API keys the CI does not hold.
      # The relay requires AISSTREAM_API_KEY and hard-exits at startup without
      # it (verified: the first CI run failed exactly here). We can't assert it
      # binds 3004 with only a fake key — whether a bad key is fatal at connect
      # time or just logged-and-retried is not knowable without the upstream
      # source. So the assertion is deliberately modest: given a dummy key, the
      # process must get PAST the env-var gate and stay up for a few seconds
      # rather than crash-looping. That proves the image runs and the entrypoint
      # is wired; live connectivity is exercised in-cluster with a real key.
      - name: Smoke test
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          podman run -d --name relay-smoke \
            -e PORT=3004 \
            -e RELAY_SHARED_SECRET=ci-smoke-test-secret \
            -e AISSTREAM_API_KEY=ci-smoke-dummy-key \
            "localhost/${RELAY_IMAGE}:amd64"

          # Give it a moment to either settle or crash.
          sleep 6

          if ! podman inspect -f '{{.State.Running}}' relay-smoke 2>/dev/null | grep -q true; then
            echo "::error::relay exited during startup"
            echo "--- exit code ---"
            podman inspect -f '{{.State.ExitCode}}' relay-smoke 2>/dev/null || true
            echo "--- logs ---"
            podman logs relay-smoke
            exit 1
          fi

          # Confirm it cleared the env-var gate that failed the first run —
          # if that specific error is present, the process is misconfigured
          # even if a supervisor kept the container alive.
          if podman logs relay-smoke 2>&1 | grep -q "AISSTREAM_API_KEY environment variable not set"; then
            echo "::error::relay still reports missing AISSTREAM_API_KEY"
            podman logs relay-smoke
            exit 1
          fi

          echo "relay started and stayed up with a dummy key"
          UID_IN_IMAGE="$(podman inspect localhost/${RELAY_IMAGE}:amd64 --format '{{.Config.User}}')"
          [ "$UID_IN_IMAGE" = "1001" ] || { echo "::error::expected USER 1001, got '${UID_IN_IMAGE}'"; exit 1; }
          podman rm -f relay-smoke

      - name: Export, SBOM, scan
        run: |
          set -euo pipefail
          podman save --format oci-archive \
            -o "relay-${{ matrix.arch }}.tar" \
            "localhost/${RELAY_IMAGE}:${{ matrix.arch }}"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          syft "oci-archive:relay-${{ matrix.arch }}.tar" \
            -o "spdx-json=sbom-relay-${{ matrix.arch }}.spdx.json" -o table
          # Report only — see the note on the app's Scan step.
          grype "oci-archive:relay-${{ matrix.arch }}.tar" \
            -o table -o "json=scan-relay-${{ matrix.arch }}.json"

      - name: Scan summary
        if: always()
        run: |
          set -euo pipefail
          [ -f "scan-relay-${{ matrix.arch }}.json" ] || exit 0
          python3 ci/scan-summary.py "scan-relay-${{ matrix.arch }}.json" "relay-${{ matrix.arch }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: security-relay-${{ matrix.arch }}
          path: |
            sbom-relay-${{ matrix.arch }}.spdx.json
            scan-relay-${{ matrix.arch }}.json
          retention-days: 90

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$QUAY_PASS" | podman login -u "$QUAY_USER" --password-stdin "${REGISTRY}"
          # Relay shares the app's Quay repo (worldmonitor-openshift) under a
          # relay- tag prefix, rather than a second repo. One repo, one set of
          # robot permissions. IMAGE_NAME is the shared repo; RELAY_IMAGE stays
          # the local build tag only.
          DEST="${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}"
          podman push "localhost/${RELAY_IMAGE}:${{ matrix.arch }}" \
            "${DEST}:relay-${{ needs.resolve.outputs.short }}-${{ matrix.arch }}"


  # The Redis REST proxy. Third image in the same Quay repo, redis-rest- tag
  # prefix.
  #
  # Why this exists: the deployment previously ran hiett/serverless-redis-http,
  # which implements only the POST command forms of the Upstash REST API. The
  # app's readCachedJson() issues path-style GETs (GET /get/<key>), so every
  # cache read returned 404. The handlers swallow that as an empty result, so
  # panels rendered "Temporarily unavailable" with no error surfaced anywhere.
  # Upstream ships docker/redis-rest-proxy.mjs which handles GET /{cmd}/{args},
  # POST /, POST /pipeline and POST /multi-exec — the full set the app uses.
  # containers/Containerfile.redis-rest rebuilds it on UBI 10 for restricted SCC.
  build-redis-rest:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PROXY_IMAGE: worldmonitor-redis-rest        # local build tag
      IMAGE_NAME: worldmonitor-openshift          # shared Quay repo (push dest)
    steps:
      - uses: actions/checkout@v4

      # Unlike the app and relay, this image's source file lives in the
      # UPSTREAM tree (docker/redis-rest-proxy.mjs), not this repo. Only the
      # Containerfile is copied across.
      - name: Fetch upstream at resolved SHA
        run: |
          set -euo pipefail
          REPO="$GITHUB_WORKSPACE"
          [ -f "$REPO/containers/Containerfile.redis-rest" ] \
            || { echo "::error::missing containers/Containerfile.redis-rest"; exit 1; }
          git clone --filter=blob:none --no-checkout \
            "https://github.com/${UPSTREAM_REPO}.git" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach "${{ needs.resolve.outputs.sha }}"
          # Assert the upstream file the Containerfile COPYs actually exists at
          # this SHA — a rename upstream would otherwise surface as an opaque
          # buildah COPY failure.
          [ -f "$RUNNER_TEMP/upstream/docker/redis-rest-proxy.mjs" ] \
            || { echo "::error::upstream docker/redis-rest-proxy.mjs not found at this SHA"; exit 1; }
          mkdir -p "$RUNNER_TEMP/upstream/containers"
          cp "$REPO/containers/Containerfile.redis-rest" \
             "$RUNNER_TEMP/upstream/containers/"

      - name: Build
        run: |
          cd "$RUNNER_TEMP/upstream"
          set -euo pipefail
          podman build --runtime runc \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg VERSION="${{ needs.resolve.outputs.short }}" \
            --build-arg VCS_REF="${{ needs.resolve.outputs.sha }}" \
            --build-arg BUILD_DATE="${{ needs.resolve.outputs.date }}" \
            -f containers/Containerfile.redis-rest \
            -t "localhost/${PROXY_IMAGE}:${{ matrix.arch }}" \
            .

      # Full round-trip against a real Redis. This is deliberately not a
      # "does the process start" test: the bug this image fixes was that
      # path-style GET returned 404 while every other form worked, so the
      # smoke test asserts exactly that path.
      - name: Smoke test
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          PW="smoke-$(openssl rand -hex 8)"
          TOKEN="smoke-$(openssl rand -hex 8)"

          podman network create wm-smoke >/dev/null 2>&1 || true
          podman run -d --name smoke-redis --network wm-smoke \
            docker.io/redis:7-alpine \
            redis-server --requirepass "$PW"

          podman run -d --name smoke-proxy --network wm-smoke -p 18080:8080 \
            -e SRH_CONNECTION_STRING="redis://:${PW}@smoke-redis:6379" \
            -e SRH_TOKEN="$TOKEN" \
            -e PORT=8080 \
            "localhost/${PROXY_IMAGE}:amd64"

          for i in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer ${TOKEN}" \
                 http://127.0.0.1:18080/ >/dev/null 2>&1; then
              echo "proxy responding after ${i}s"; break
            fi
            [ "$i" = 40 ] && { echo "::error::proxy never came up"; podman logs smoke-proxy; exit 1; }
            sleep 1
          done

          # Write via POST path form (what setCachedJson uses)...
          curl -fsS -X POST -H "Authorization: Bearer ${TOKEN}" \
            http://127.0.0.1:18080/set/smoke:key:v1/hello >/dev/null

          # ...and read back via path-style GET (what readCachedJson uses, and
          # what hiett's SRH 404s on).
          OUT="$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "http://127.0.0.1:18080/get/smoke%3Akey%3Av1")"
          echo "GET returned: ${OUT}"
          echo "$OUT" | grep -q '"result":"hello"' \
            || { echo "::error::path-style GET did not round-trip"; podman logs smoke-proxy; exit 1; }

          # Auth must actually be enforced — a proxy that ignores SRH_TOKEN
          # would pass every test above while leaving the cache open.
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:18080/get/smoke%3Akey%3Av1")"
          [ "$CODE" = "401" ] || [ "$CODE" = "403" ] \
            || { echo "::error::unauthenticated GET returned ${CODE}, expected 401/403"; exit 1; }

          UID_IN_IMAGE="$(podman inspect localhost/${PROXY_IMAGE}:amd64 --format '{{.Config.User}}')"
          [ "$UID_IN_IMAGE" = "1001" ] || { echo "::error::expected USER 1001, got '${UID_IN_IMAGE}'"; exit 1; }

          podman rm -f smoke-proxy smoke-redis

      - name: Export, SBOM, scan
        run: |
          set -euo pipefail
          podman save --format oci-archive \
            -o "redis-rest-${{ matrix.arch }}.tar" \
            "localhost/${PROXY_IMAGE}:${{ matrix.arch }}"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          syft "oci-archive:redis-rest-${{ matrix.arch }}.tar" \
            -o "spdx-json=sbom-redis-rest-${{ matrix.arch }}.spdx.json" -o table
          # Report only — see the note on the app's Scan step.
          grype "oci-archive:redis-rest-${{ matrix.arch }}.tar" \
            -o table -o "json=scan-redis-rest-${{ matrix.arch }}.json"

      - name: Scan summary
        if: always()
        run: |
          set -euo pipefail
          [ -f "scan-redis-rest-${{ matrix.arch }}.json" ] || exit 0
          python3 ci/scan-summary.py "scan-redis-rest-${{ matrix.arch }}.json" "redis-rest-${{ matrix.arch }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: security-redis-rest-${{ matrix.arch }}
          path: |
            sbom-redis-rest-${{ matrix.arch }}.spdx.json
            scan-redis-rest-${{ matrix.arch }}.json
          retention-days: 90

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$QUAY_PASS" | podman login -u "$QUAY_USER" --password-stdin "${REGISTRY}"
          DEST="${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}"
          podman push "localhost/${PROXY_IMAGE}:${{ matrix.arch }}" \
            "${DEST}:redis-rest-${{ needs.resolve.outputs.short }}-${{ matrix.arch }}"

  manifest:
    needs: [resolve, build, build-relay, build-redis-rest]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Workflow-level `env:` IS inherited by jobs, but repeating the three
      # values this job uses keeps it readable and survives someone splitting
      # the file later.
      REGISTRY: quay.io
      IMAGE_NS: ryan_nix
      IMAGE_NAME: worldmonitor-openshift
    steps:
      - name: Assemble manifest list
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$QUAY_PASS" | podman login -u "$QUAY_USER" --password-stdin "${REGISTRY}"
          SHORT="${{ needs.resolve.outputs.short }}"

          DEST="${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}"

          # Two images, one repo. The app uses bare tags (<sha>, latest); the
          # relay uses relay-prefixed tags (relay-<sha>, relay-latest). Each
          # manifest list is assembled from its two per-arch tags.
          #   app:   <sha>-amd64  + <sha>-arch        -> <sha>,        latest
          #   relay: relay-<sha>-amd64 + ...-arm64    -> relay-<sha>,  relay-latest
          #   proxy: redis-rest-<sha>-amd64 + ...     -> redis-rest-<sha>, redis-rest-latest
          assemble() {
            local per_arch_prefix="$1" list_a="$2" list_b="$3"
            for TAG in "$list_a" "$list_b"; do
              podman manifest rm "${DEST}:${TAG}" 2>/dev/null || true
              podman manifest create "${DEST}:${TAG}"
              podman manifest add "${DEST}:${TAG}" "docker://${DEST}:${per_arch_prefix}-amd64"
              podman manifest add "${DEST}:${TAG}" "docker://${DEST}:${per_arch_prefix}-arm64"
              podman manifest push --all "${DEST}:${TAG}" "docker://${DEST}:${TAG}"
              echo "pushed ${DEST}:${TAG}"
            done
          }
          assemble "${SHORT}"            "${SHORT}"            "latest"
          assemble "relay-${SHORT}"      "relay-${SHORT}"      "relay-latest"
          assemble "redis-rest-${SHORT}" "redis-rest-${SHORT}" "redis-rest-latest"

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo
            echo '```'
            echo "podman pull ${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}:${{ needs.resolve.outputs.short }}"
            echo "podman pull ${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}:relay-${{ needs.resolve.outputs.short }}"
            echo "podman pull ${REGISTRY}/${IMAGE_NS}/${IMAGE_NAME}:redis-rest-${{ needs.resolve.outputs.short }}"
            echo '```'
            echo
            echo "Upstream commit: \`${{ needs.resolve.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"