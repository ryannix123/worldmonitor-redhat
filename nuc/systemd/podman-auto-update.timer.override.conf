# Drop-in for the USER unit podman-auto-update.timer (installed to
# ~wm/.config/systemd/user/podman-auto-update.timer.d/override.conf).
# The nightly CI publishes new images at 07:00 UTC (03:00 Eastern). Pull them
# at 05:00 local, well after the build finishes, before anyone is in the office.
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:00:00
RandomizedDelaySec=15m
Persistent=true
